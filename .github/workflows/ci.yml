name: CI/CD

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install pytest==8.4.2

      - name: Run pytest
        run: pytest

  docker:
    name: Docker build and smoke test
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f app/.Dockerfile -t car-price-app:ci app

      - name: Start container
        run: docker run -d --name car-price-app -p 8050:8050 car-price-app:ci

      - name: Wait for the app to answer
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8050/ > /dev/null; then
              echo "app is up after ${attempt}s"
              exit 0
            fi
            sleep 1
          done
          echo "app did not start in time"
          docker logs car-price-app
          exit 1

      - name: Check the predict page is served
        run: curl -fsS http://localhost:8050/predict | grep -q "Chaky Car Price Predictor"

      - name: Check the Dash callback endpoint is registered
        run: |
          curl -fsS http://localhost:8050/_dash-dependencies \
            | grep -q "prediction-output"

      - name: Container logs
        if: always()
        run: docker logs car-price-app

      - name: Stop container
        if: always()
        run: docker rm -f car-price-app

      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push the tested image to Docker Hub
        if: github.event_name == 'push'
        env:
          # defaults to <your-docker-hub-user>/car-price-predictor; override with a
          # DOCKERHUB_REPOSITORY repo variable to publish under a different name
          IMAGE_NAME: ${{ vars.DOCKERHUB_REPOSITORY || format('{0}/car-price-predictor', secrets.DOCKERHUB_USERNAME) }}
        run: |
          IMAGE=$(echo "${IMAGE_NAME}" | tr '[:upper:]' '[:lower:]')
          docker tag car-price-app:ci "${IMAGE}:${GITHUB_SHA}"
          docker tag car-price-app:ci "${IMAGE}:latest"
          docker push "${IMAGE}:${GITHUB_SHA}"
          docker push "${IMAGE}:latest"
